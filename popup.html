<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Way</title>
</head>
<body>
    <div class="contenedor">

        <!-- Checkbox con span -->
        <label class="checkbox-container">
            <input type="checkbox" id="miCheckbox">
            <span class="checkmark"></span>
            Deactivate on this page
        </label>

    </div>

    <div class="contenedor">

        <!-- Switch button -->
        <label class="switch">
            <input type="checkbox">
            <span class="slider round">Turn off</span>
        </label>

        <div class="buttons">
            <button class="btn">Delete shortcut</button>
            <button class="btn">Change shortcut</button>
            <button class="btn">Add shortcut</button>
        </div>

    </div>
</body>
</html>
